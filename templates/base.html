<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Matthew Codey — MLIS academic librarian working at the seam of library service and library systems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <title>{% block title %}Home{% endblock %} · Matthew Codey</title>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ url_for('index') }}">Matthew <span>Codey</span></a>
      <nav>
        <ul>
          <li><a class="navlink {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Home</a></li>
          <li><a class="navlink {% if request.endpoint == 'projects' %}active{% endif %}" href="{{ url_for('projects') }}">Projects</a></li>
          <li><a class="navlink {% if request.endpoint == 'resume' %}active{% endif %}" href="{{ url_for('resume') }}">Resume</a></li>
          <li><a class="navlink {% if request.endpoint == 'contact' %}active{% endif %}" href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap foot-inner">
      <div>© 2026 Matthew Codey · Los Angeles, CA</div>
      <div class="foot-links">
        <a href="mailto:matthew.codey@gmail.com">Email</a>
        <a href="https://github.com/bdmcodey" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
