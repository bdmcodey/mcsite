<title id="fig-releases-tall-t">119 numbered versions, Jul 24 to Nov 10, 2026</title>
<desc id="fig-releases-tall-d">Each dot is one numbered version of the Workbench. 84 of the 119 came in September. Jul 24: First working version (0.1.0). Sep 16: Workbench replaces the other two (0.11.0). Sep 25: Simulated Alma round trip (0.28.0). The latest is 0.50.0, on Nov 10.</desc>
