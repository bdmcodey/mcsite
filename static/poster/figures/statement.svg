<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-labelledby="fig-statement-t fig-statement-d">
<title id="fig-statement-t">One 866 statement and the 853/863 it becomes</title>
<desc id="fig-statement-d">The free-text statement “v. 27 no. 4-v. 31 no. 4 (April 1992-April 1996)” converts to two fields. The 853 names the levels: $a v., $b no., $i year, $j month. The 863 records the holdings: $a 27-31, $b 4-4, $i 1992-1996, $j 04-04. In full: 853 31 $8 1 $a v. $b no. $i (year) $j (month); 863 40 $8 1.1 $a 27-31 $b 4-4 $i 1992-1996 $j 04-04.</desc>
