<title id="fig-releases-wide-t">99 releases, 24 Jul to 12 Oct 2026</title>
<desc id="fig-releases-wide-d">Each dot is one released version of the Workbench, stacked by day. 84 of the 99 came in September. 24 Jul: First working version (0.1.0). 16 Sep: Three apps become one (0.11.0). 25 Sep: Simulated Alma round trip (0.28.0). The latest is 0.35.0, on 12 Oct.</desc>
