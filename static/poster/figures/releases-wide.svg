<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" role="img" aria-labelledby="fig-releases-wide-t fig-releases-wide-d">
<title id="fig-releases-wide-t">119 releases, Jul 24 to Nov 10, 2026</title>
<desc id="fig-releases-wide-d">Each dot is one released version of the Workbench, stacked by day. 84 of the 119 came in September. Jul 24: First working version (0.1.0). Sep 16: Workbench replaces the other two (0.11.0). Sep 25: Simulated Alma round trip (0.28.0). The latest is 0.50.0, on Nov 10.</desc>
