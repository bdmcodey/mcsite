<title id="fig-releases-wide-t">118 releases, 24 Jul to 30 Oct 2026</title>
<desc id="fig-releases-wide-d">Each dot is one released version of the Workbench, stacked by day. 84 of the 118 came in September. 24 Jul: First working version (0.1.0). 16 Sep: Workbench replaces the other two (0.11.0). 25 Sep: Simulated Alma round trip (0.28.0). The latest is 0.49.0, on 30 Oct.</desc>
